name: 同步科技热点

# 每天 UTC 02:00（北京时间 10:00）自动跑一次，把三个科技源的热榜同步进站点
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:        # 也支持在 Actions 页面手动点一下立刻执行

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 拉取并生成热点数据
        run: python tools/sync_hotnews.py --limit 20

      - name: 有变化才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain assets/js/hotnews.js)" ]; then
            git add assets/js/hotnews.js
            git commit -m "chore: 同步科技热点 $(date -u +'%Y-%m-%d')"
            git push
            echo "已同步并提交新内容"
          else
            echo "内容无变化，跳过提交"
          fi
