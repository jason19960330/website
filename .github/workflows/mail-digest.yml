name: 每日 AI 资讯早报

on:
  schedule:
    - cron: '30 0 * * *' # UTC 00:30 = 北京时间每天 08:30
  workflow_dispatch: # 也支持在 Actions 页面手动触发

permissions:
  contents: read

jobs:
  mail:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 计算日期
        run: echo "MAIL_DATE=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_ENV"

      - name: 生成早报
        run: node tools/mail_digest.mjs

      - name: 发送早报邮件
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          subject: 'AI 资讯早报 · ${{ env.MAIL_DATE }}'
          to: 573164137@qq.com
          from: AI 速览早报 <${{ secrets.MAIL_USER }}>
          html_body: mail-digest.html
