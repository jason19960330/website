<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>李文涛 | 个人主页 (Vue 3)</title>
  <!-- 引入 TailwindCSS 样式库 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Vue 3 官方 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6 antialiased selection:bg-sky-500 selection:text-white">

  <!-- Vue 挂载根节点 -->
  <div id="app" class="max-w-xl w-full bg-slate-900/90 backdrop-blur-md border border-slate-800 rounded-3xl p-8 shadow-2xl transition-all duration-300 hover:border-slate-700">
    
    <!-- 头部信息 -->
    <header class="flex items-center space-x-5 mb-6">
      <div class="w-20 h-20 rounded-2xl bg-gradient-to-tr from-sky-400 to-indigo-600 flex items-center justify-center text-2xl font-bold text-white shadow-lg shadow-sky-500/20">
        {{ profile.avatarText }}
      </div>
      <div>
        <div class="flex items-center space-x-2">
          <h1 class="text-2xl font-bold text-white tracking-tight">{{ profile.name }}</h1>
          <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-950/80 text-emerald-400 border border-emerald-800/50">在线</span>
        </div>
        <p class="text-sky-400 text-sm font-medium mt-1">{{ profile.title }}</p>
      </div>
    </header>

    <!-- 个人简介 -->
    <section class="mb-6">
      <p class="text-slate-300 text-sm leading-relaxed">
        {{ profile.bio }}
      </p>
    </section>

    <!-- 核心技能 (Vue v-for 循环渲染) -->
    <section class="mb-6">
      <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">核心技能 / SKILLS</h2>
      <div class="flex flex-wrap gap-2">
        <span 
          v-for="(skill, index) in profile.skills" 
          :key="index"
          class="px-3 py-1.5 bg-slate-800/80 border border-slate-700 hover:border-sky-500/50 text-xs rounded-xl text-slate-200 transition-colors shadow-sm cursor-default"
        >
          {{ skill }}
        </span>
      </div>
    </section>

    <!-- 底部链接与社交媒体 -->
    <footer class="pt-6 border-t border-slate-800 flex items-center justify-between text-sm">
      <a :href="'mailto:' + profile.contact.email" class="inline-flex items-center space-x-1.5 text-sky-400 hover:text-sky-300 font-medium transition-colors">
        <span>✉️ 发送邮件</span>
      </a>
      <div class="flex items-center space-x-4">
        <a 
          v-for="link in profile.socialLinks" 
          :key="link.name" 
          :href="link.url" 
          target="_blank"
          class="text-slate-400 hover:text-slate-200 transition-colors"
        >
          {{ link.name }}
        </a>
      </div>
    </footer>

  </div>

  <!-- Vue 应用逻辑 -->
  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        // 在这里直接修改你的个人数据，界面会自动响应更新
        const profile = ref({
          name: "李文涛",
          avatarText: "WT",
          title: "AI 探索者 / 自动化工作流构建",
          bio: "热衷于探索大模型应用、智能体技能（Agent Skills）与 Python 生产力自动化。致力于用技术提升日常效率与个人知识体系质量。",
          skills: [
            "AI Agent Skills",
            "Python 脚本自动化",
            "Obsidian 知识管理",
            "Prompt 工程",
            "Vue.js 前端交互"
          ],
          contact: {
            email: "573164137@qq.com"
          },
          socialLinks: [
            { name: "GitHub", url: "https://github.com/jason19960330" },
            { name: "Website", url: "https://jason19960330.github.io/website/" }
          ]
        });

        return { profile };
      }
    }).mount('#app');
  </script>
</body>
</html>
