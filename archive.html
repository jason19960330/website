  <script>
    (function () {
      try {
        var saved = localStorage.getItem('site.theme');
        if (!saved) {
          saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        if (saved === 'dark') document.documentElement.classList.add('dark');
        document.addEventListener('DOMContentLoaded', function () {
          document.body.setAttribute('arco-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        });
      } catch (e) { /* 隐私模式忽略 */ }
    })();
  </script>

  <link rel="stylesheet" href="assets/css/tailwind.css?v=202609302">
  <link rel="stylesheet" href="vendor/arco-bundle.css?v=20260923">
  <link rel="stylesheet" href="assets/css/style.css?v=20261114c">
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>

  <div id="archive-app">
    <header class="site-header is-solid border-b border-hair">
      <div class="mx-auto flex h-16 max-w-3xl items-center justify-between gap-3 px-5 sm:px-6">
        <a href="index.html" class="inline-flex items-center gap-2 text-sm text-dim transition hover:text-accent">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>
          <span class="hidden sm:inline">回到生活首页</span><span class="sm:hidden">首页</span>
        </a>
        <nav class="hidden items-center gap-0.5 md:flex" aria-label="页面入口">
          <a href="work.html" class="nav-link">工作经历</a>
          <a href="resume.html" class="nav-link">完整简历</a>
        </nav>
        <button type="button" @click="toggleTheme" :aria-label="theme === 'dark' ? '切换到浅色' : '切换到深色'"
                class="grid h-9 w-9 place-items-center rounded-lg border border-hair text-dim transition hover:border-accent hover:text-accent">
          <svg v-if="theme === 'dark'" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
          <svg v-else class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"></path></svg>
        </button>
      </div>
    </header>

    <main id="main" tabindex="-1" class="mx-auto max-w-3xl px-5 pb-20 pt-16 sm:px-6 sm:pt-20">
      <section id="archive">
        <div class="chapter-head">
          <span class="chapter-no">01</span>
          <h1 class="chapter-title">{{ archive.title }}</h1>
          <span class="chapter-kicker">{{ archive.kicker }}</span>
        </div>
        <p class="chapter-sub mb-6">首页只保留最新 3 条分享，更早的记录会按书写顺序自动收进这一页。</p>

        <div v-if="archive.entries.length">
          <div v-for="(e, i) in archive.entries" :key="'ar-' + i" class="life-item">
            <span class="life-dot" aria-hidden="true"></span>
            <p class="life-year">{{ e.year }}</p>
            <a v-if="e.url" :href="e.url" class="life-title-link mt-1">
              <span class="life-title">{{ e.title }}</span>
              <svg class="life-title-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
            </a>
            <p v-else class="life-title mt-1">{{ e.title }}</p>
            <p class="life-desc mt-1.5">{{ e.desc }}</p>
            <p v-if="e.tag" class="mt-2 text-xs text-accent">{{ e.tag }}</p>
            <div v-if="e.cover || e.photoPending" class="life-cover" :class="{ 'is-empty': !e.cover }">
              <img v-if="e.cover" :src="e.cover" :alt="e.caption || e.title" loading="lazy">
              <p v-else class="life-cover-empty">等待补上照片</p>
            </div>
          </div>
        </div>
        <div v-else class="life-empty">
          <p>{{ archive.empty }}</p>
        </div>

        <a href="index.html#life" class="life-back">返回首页 · 这几年</a>
      </section>
    </main>
  </div>
